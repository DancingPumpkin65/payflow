name: Android checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and expose compiler errors
        run: |
          set +e
          gradle testDebugUnitTest assembleDebug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            details=$(tail -n 80 build.log | tr '\n' ' ' | sed 's/::/: :/g')
            echo "::error title=Gradle failure::$details"
            exit "$status"
          fi

  screenshot:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.dancingpumpkin.payflow -c android.intent.category.LAUNCHER 1
            sleep 4
            adb exec-out screencap -p > payflow-calendar.png
      - uses: actions/upload-artifact@v4
        with:
          name: payflow-calendar-screenshot
          path: payflow-calendar.png
